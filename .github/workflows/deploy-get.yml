name: Deploy get.perysee.com

# Publishes infra/get/.htaccess to the document root of get.perysee.com on o2switch. The domain only
# redirects to the public GitHub releases of this repository, so it works once the repository is public.
# The cPanel actions are copies of the ones in Perysee/web: keep both in step.

on:
  push:
    branches: [main]
    paths:
      - infra/get/**
      - tests/Distribution/get.test.mjs
      - .github/workflows/deploy-get.yml
      - .github/actions/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-get-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: node --test tests/Distribution/get.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-get
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            infra/get
            .github/actions
          persist-credentials: false
      - uses: ./.github/actions/cpanel-open
        with:
          host: ${{ secrets.CPANEL_HOST }}
          user: ${{ secrets.CPANEL_USER }}
          api-token: ${{ secrets.CPANEL_API_TOKEN }}
          ssh-private-key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
      - name: Publish the redirections
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          set -euo pipefail
          root="/home/$CPANEL_USER/perysee/get/public"
          # shellcheck disable=SC2086
          ssh $CPANEL_SSH_OPTIONS "$CPANEL_USER@$CPANEL_HOST" "mkdir -p '$root'"
          # Only the .htaccess belongs here: --delete keeps the document root free of anything else.
          rsync -az --delete --include='.htaccess' --exclude='*' --exclude='.well-known' \
            -e "ssh $CPANEL_SSH_OPTIONS" infra/get/ "$CPANEL_USER@$CPANEL_HOST:$root/"
      - name: Smoke test
        run: |
          set -uo pipefail
          origin='https://get.perysee.com'
          base='https://github.com/Perysee/app/releases'
          failures=0
          location() { curl -sI --max-time 20 --retry 5 --retry-delay 3 --retry-all-errors "$1" | tr -d '\r' | sed -n 's/^[Ll]ocation: //p'; }
          check() { # label actual expected
            if [[ "$2" == "$3" ]]; then echo "  ok    $1"; else echo "  FAIL  $1: got '$2', expected '$3'" >&2; failures=$((failures + 1)); fi
          }
          check 'root serves the latest installer' "$(location "$origin/")" "$base/latest/download/install.sh"
          check 'install.php, latest' "$(location "$origin/install.php")" "$base/latest/download/install.php"
          check 'SHA256SUMS, exact tag' "$(location "$origin/releases/v0.1.1/SHA256SUMS")" "$base/download/v0.1.1/SHA256SUMS"
          check 'unlisted asset' "$(curl -s -o /dev/null -w '%{http_code}' "$origin/releases/v0.1.1/secret.txt")" 404
          check 'unlisted path' "$(curl -s -o /dev/null -w '%{http_code}' "$origin/anything")" 404
          check 'POST refused' "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$origin/")" 405
          check 'HTTP goes to HTTPS' "$(location "http://get.perysee.com/")" "$origin/"
          exit $((failures > 0))
      - uses: ./.github/actions/cpanel-close
        if: always()
        with:
          host: ${{ secrets.CPANEL_HOST }}
          user: ${{ secrets.CPANEL_USER }}
          api-token: ${{ secrets.CPANEL_API_TOKEN }}
