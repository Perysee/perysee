name: Release

# A release is made by merging a version bump. `Prepare release` opens that pull request; when it reaches main,
# config/perysee.php names a version without a tag, and this workflow tests, builds, publishes the GitHub release
# and creates its tag in one step. Instances read the same GitHub releases to offer updates, so a release only
# exists once its archive and SHA256SUMS are attached.

on:
  push:
    branches: [main]
    paths: [config/perysee.php]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(sed -n "s/.*'version' => '\([^']*\)'.*/\1/p" config/perysee.php | head -n 1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=config/perysee.php::'version' must look like 1.2.3 or 1.2.3-beta.1 (found '$version')."
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag" > /dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ] && [ "$exists" = true ]; then
            echo "Tag $tag already exists: nothing to release."
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = push ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Manual run: build and test only, nothing is published."
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml

  package:
    needs: [plan, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # A throwaway database for the terminal-installation smoke test of the production ZIP below.
      mariadb:
        image: mariadb:11.4.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: perysee_smoke
          MARIADB_USER: perysee_smoke
          MARIADB_PASSWORD: ci-smoke-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pdo_mysql, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - run: composer check-platform-reqs --no-dev
      - run: npm ci
      - run: npm run build
      - name: Package ready-to-install assets
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: php scripts/build-release.php --version "$RELEASE_VERSION" --repository "$RELEASE_REPOSITORY"
      - name: Verify the checksums that will be published
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Smoke-test the actual production ZIP
        run: |
          php dist/install.php --archive dist/perysee.zip --checksums dist/SHA256SUMS --target "$RUNNER_TEMP/perysee-smoke" --url https://stats.example.com --yes --finish none
          cd "$RUNNER_TEMP/perysee-smoke"
          php artisan --version
          test ! -f .env
          test "$(php -r 'echo json_decode(file_get_contents("release.json"))->version;')" = "${{ needs.plan.outputs.tag }}"
          # The config file calls env() and storage_path(), which only exist inside Laravel: read the literal.
          test "$(sed -n "s/^ *'version' => '\([^']*\)',.*/\1/p" config/perysee.php)" = "${{ needs.plan.outputs.version }}"
      - name: Smoke-test the terminal installation of the production ZIP
        env:
          PERYSEE_DB_PASSWORD: ci-smoke-only
          PERYSEE_ADMIN_PASSWORD: Smoke-Test-Password-123
        run: |
          cd "$RUNNER_TEMP/perysee-smoke"
          php artisan perysee:install --url https://stats.example.com --db-host 127.0.0.1 --db-port 3306 --db-name perysee_smoke --db-user perysee_smoke --admin-name Smoke --admin-email smoke@example.com --no-interaction
          test -f storage/app/private/installation/installed
          test ! -f storage/app/private/installation/secret
          test -f .env
          # An installed instance is never installed again.
          if php artisan perysee:install --url https://stats.example.com --db-host 127.0.0.1 --db-port 3306 --db-name perysee_smoke --db-user perysee_smoke --admin-name Other --admin-email other@example.com --no-interaction; then
            echo "::error::A second installation was accepted."
            exit 1
          fi
      - name: Smoke-test the Docker image built from the release files
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.tag }}
        run: |
          docker build --build-arg PHP_VERSION=8.3 --tag perysee-smoke dist
          docker run --rm --entrypoint php perysee-smoke artisan --version
          docker run --rm --entrypoint php perysee-smoke -r 'foreach (["pdo_mysql", "zip", "mbstring", "openssl"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "missing $e\n"); exit(1); } }'
          test "$(docker run --rm --entrypoint php perysee-smoke -r 'echo json_decode(file_get_contents("release.json"))->version;')" = "$RELEASE_VERSION"
          printf 'APP_URL=https://stats.example.com\nAPP_KEY=base64:%s\nDB_DATABASE=perysee\nDB_USERNAME=perysee\nDB_PASSWORD=ci\nMARIADB_ROOT_PASSWORD=ci\n' "$(openssl rand -base64 32)" > "$RUNNER_TEMP/smoke.env"
          docker compose --env-file "$RUNNER_TEMP/smoke.env" --file dist/compose.yaml config --quiet
      - uses: actions/upload-artifact@v7
        with:
          name: perysee-release
          path: |
            dist/perysee.zip
            dist/install.php
            dist/install.sh
            dist/Dockerfile
            dist/compose.yaml
            dist/docker-entrypoint.sh
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Add required reviewers to the "release" environment (Settings > Environments) for a manual gate.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: perysee-release
          path: dist
      - name: Publish all release assets together, then create the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "Perysee $RELEASE_TAG" --generate-notes dist/perysee.zip dist/install.php dist/install.sh dist/Dockerfile dist/compose.yaml dist/docker-entrypoint.sh dist/SHA256SUMS
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --prerelease --draft=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
