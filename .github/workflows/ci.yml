name: Application checks

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / MariaDB ${{ matrix.mariadb }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Every PHP version runs against the default database; the other supported MariaDB series (see
      # App\Installation\DatabaseVersion) are each covered once, on the oldest and the newest PHP.
      # `mariadb` is the series and names the job: the branch rulesets require "PHP 8.3 / MariaDB 11.4" and
      # "PHP 8.5 / MariaDB 11.4" by that name. The default series is pinned to a patch release below.
      matrix:
        php: ['8.3', '8.4', '8.5']
        mariadb: ['11.4']
        include:
          - php: '8.3'
            mariadb: '10.11'
          - php: '8.5'
            mariadb: '11.8'
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb == '11.4' && '11.4.8' || matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: perysee_test
          MARIADB_USER: perysee_test
          MARIADB_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pdo_mysql, pdo_sqlite, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Create safe environment for test bootstrapping
        run: cp .env.example .env
      - run: composer install --prefer-dist --no-interaction
      - run: npm ci
      - run: npm run build
      - run: composer test
      - name: Configure isolated MariaDB test database
        run: |
          cat > .env.testing <<'ENV'
          APP_ENV=testing
          DB_CONNECTION=mariadb
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=perysee_test
          DB_USERNAME=perysee_test
          DB_PASSWORD=ci-test-only
          DB_URL=
          ENV
          chmod 600 .env.testing
      - run: composer test:mariadb
      - run: npm run test:charts
      - run: npm run test:tracker
      - run: npm run test:distribution
      - run: bash -n scripts/install.sh
      - name: Lint the shell installer
        run: shellcheck --severity=warning scripts/install.sh
