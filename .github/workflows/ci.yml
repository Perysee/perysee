name: Application checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / MariaDB 11.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    services:
      mariadb:
        image: mariadb:11.4.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: perysee_test
          MARIADB_USER: perysee_test
          MARIADB_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pdo_mysql, pdo_sqlite, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - run: npm ci
      - run: npm run build
      - run: composer test
      - name: Configure isolated MariaDB test database
        run: |
          cat > .env.testing <<'ENV'
          APP_ENV=testing
          DB_CONNECTION=mariadb
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=perysee_test
          DB_USERNAME=perysee_test
          DB_PASSWORD=ci-test-only
          DB_URL=
          ENV
          chmod 600 .env.testing
      - run: composer test:mariadb
      - run: npm run test:tracker
      - run: npm run test:distribution
      - run: bash -n scripts/install.sh
